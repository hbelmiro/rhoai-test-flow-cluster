name: uv lock check

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hbelmiro/uv-lock-check@5e383ca4a558c5c8b39c577601d7c71e7d9290dd # v0.3.0
